<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livros | Oficina da Leitura</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
 
  <header class="cabecalho">
    <div class="logo">📖 Oficina da Leitura</div>
    <nav class="menu">
      <a href="painel.html">Painel</a>
      <a href="livros.html">Livros</a>
      <a href="movimentacoes.html">Movimentações</a>
      <a href="index.html" id="link-sair">Sair</a>
    </nav>
  </header>
 
  <main>
    <h1>Livros</h1>
 
    <section class="cartao">
      <h2>Cadastrar novo livro</h2>
      <form id="form-livro">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" placeholder="Ex.: Dom Casmurro" required>
 
        <label for="autor">Autor</label>
        <input type="text" id="autor" placeholder="Ex.: Machado de Assis" required>
 
        <label for="quantidade_estoque">Quantidade em estoque</label>
        <input type="number" id="quantidade_estoque" min="0" value="0">
 
        <button type="submit" class="botao">Cadastrar</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>
 
    <section class="cartao">
      <h2>Livros cadastrados</h2>
 
      <div class="linha-busca">
        <input type="text" id="busca-nome" placeholder="Buscar pelo título...">
        <button type="button" id="botao-buscar" class="botao">Buscar</button>
      </div>
 
      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Autor</th>
              <th>Estoque</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-livros">
            <tr>
              <td>1</td>
              <td>Dom Casmurro</td>
              <td>Machado de Assis</td>
              <td>12</td>
              <td><button type="button" class="botao botao-perigo botao-pequeno">Excluir</button></td>
            </tr>
            <tr>
              <td>2</td>
              <td>Capitães da Areia</td>
              <td>Jorge Amado</td>
              <td>5</td>
              <td><button type="button" class="botao botao-perigo botao-pequeno">Excluir</button></td>
            </tr>
          </tbody>
        </table>
      </div>
 
      <div class="paginacao">
        <button type="button" id="botao-anterior" class="botao botao-pequeno">Anterior</button>
        <span>Página <strong id="numero-pagina">1</strong></span>
        <button type="button" id="botao-proxima" class="botao botao-pequeno">Próxima</button>
      </div>
    </section>
  </main>
 
  <footer class="rodape">
    Oficina da Leitura © 2026 | Feito por Davi Palafóz Luz
  </footer>
 
</body>
</html>
